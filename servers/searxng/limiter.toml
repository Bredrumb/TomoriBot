# Bot detection is disabled because only TomoriBot can reach this private network container,
# and automated bot requests would otherwise be flagged (see https://docs.searxng.org/admin/searx.limiter.html).

[real_ip]
x_for = 1
ipv4_prefix = 32
ipv6_prefix = 56

[botdetection.ip_limit]
filter_link_local = false
link_token = false
