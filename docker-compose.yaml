services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: tomoribot-db
    # No env_file: the database container must not hold the bot's secrets, and a known fallback password would
    # make the superuser guessable, so the image refuses first start until .env sets POSTGRES_PASSWORD.
    environment:
      POSTGRES_DB: tomodb
      POSTGRES_USER: tomori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=tomodb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql:ro
    ports:
      # Loopback only, so host maintenance tools reach 15432 without exposing the superuser to the network.
      - "127.0.0.1:15432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomori -d tomodb"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tomori-network

  # Optional profile (--profile searxng): set SEARXNG_BASE_URL=http://searxng:8080/ in .env
  # (see servers/searxng/README.md).
  searxng:
    build:
      context: ./servers/searxng
    container_name: tomoribot-searxng
    profiles:
      - searxng
    tmpfs:
      - /etc/searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-not-for-production}
      SEARXNG_BASE_URL: http://localhost:8080/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - tomori-network

  # Optional profile (--profile fetch-crawl4ai): set CRAWL4AI_BASE_URL=http://crawl4ai:11235/,
  # CRAWL4AI_TOKEN, and FETCH_URL_ALLOW_PRIVATE_NETWORK=true in .env.
  crawl4ai:
    # Pinned: 0.9.4 requires an API token for any non-loopback bind and blocks non-global browser destinations.
    image: unclecode/crawl4ai:0.9.4
    container_name: tomoribot-crawl4ai
    profiles:
      - fetch-crawl4ai
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_TOKEN:-}
    shm_size: "3gb"
    # TomoriBot reaches the crawler over tomori-network; this host port is for local debugging only.
    ports:
      - "127.0.0.1:11235:11235"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11235/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks:
      - tomori-network

  # Optional profile (--profile slop-guard): register http://slop-guard:8765/mcp under
  # /config > Plugins > + Add MCP as "Prose Linter".
  slop-guard:
    build:
      context: ./servers/slop-guard
    container_name: tomoribot-slop-guard
    profiles:
      - slop-guard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8765), 3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tomori-network

  tomoribot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomoribot-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Override .env with individual POSTGRES_* vars (the app ignores POSTGRES_URL) so Compose
      # targets the local postgres service instead of localhost or cloud DBs.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: tomori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tomodb
      NODE_ENV: development
      # Local HTTP endpoints and .env secrets require development mode in Compose.
      RUN_ENV: development
    restart: unless-stopped
    # Docker Desktop defines host.docker.internal itself, but Linux Docker Engine only does with this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tomori-network
    volumes:
      - ./logs:/app/logs:rw
      - ./data:/app/data:rw
      - ./backups:/app/backups:rw
      # Required by backup/restore scripts so Docker bundles include the active config.
      - ./.env:/app/.env:rw

volumes:
  postgres_data:
    driver: local

networks:
  tomori-network:
    driver: bridge
