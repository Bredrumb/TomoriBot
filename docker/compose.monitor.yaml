services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: tomoribot-dashboard
    restart: unless-stopped
    ports:
      # Loopback only, because this login reaches the database superuser through the provisioned datasource.
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Paths stay repo-root-relative because Compose resolves them against the first -f file
      # (docker-compose.yaml).
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # Mounted outside provisioning/ so Grafana does not try to parse the provider YAML as a
      # dashboard JSON file.
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # Required with no fallback, because Grafana's built-in default password would otherwise guard superuser access.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      # magnesium-wordcloud-panel backs the Emotion Cloud panel in the shipped dashboard;
      # without it that panel renders as "panel plugin not found".
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,googlecloud-logging-datasource,magnesium-wordcloud-panel
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tomodb
      - POSTGRES_USER=tomori
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - tomori-network

volumes:
  grafana_data:

networks:
  tomori-network:
