services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: tomoribot-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Paths stay repo-root-relative because Compose resolves them against the first -f file
      # (docker-compose.yaml).
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # Mounted outside provisioning/ so Grafana does not try to parse the provider YAML as a
      # dashboard JSON file.
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # Preset password so Grafana skips its first-run change-password prompt.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # magnesium-wordcloud-panel backs the Emotion Cloud panel in the shipped dashboard;
      # without it that panel renders as "panel plugin not found".
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,googlecloud-logging-datasource,magnesium-wordcloud-panel
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tomodb
      - POSTGRES_USER=tomori
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_default_password}
    networks:
      - tomori-network

volumes:
  grafana_data:

networks:
  tomori-network:
