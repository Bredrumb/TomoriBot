name: Issue Assignment

on:
  issue_comment:
    types: [created]

jobs:
  assign:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim();
            if (body !== "/assign-me") return;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const commenter = context.payload.comment.user.login;
            const issue = context.payload.issue;

            if (issue.state === "closed") {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `@${commenter} This issue is closed and cannot be assigned.`,
              });
              return;
            }

            const alreadyAssigned = issue.assignees.find(
              (a) => a.login !== commenter,
            );
            if (alreadyAssigned) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `@${commenter} This issue is already assigned to @${alreadyAssigned.login}.`,
              });
              return;
            }

            await github.rest.issues.addAssignees({
              owner, repo, issue_number,
              assignees: [commenter],
            });

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `@${commenter} You've been assigned! Feel free to open a draft PR early to show the direction you're heading.`,
            });
