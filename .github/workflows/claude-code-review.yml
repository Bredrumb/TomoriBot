name: Claude Code Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # pull_request_target runs in base repo context, so the base repo's
    # GITHUB_TOKEN and secrets are available even for fork PRs. Safe here because
    # we never checkout and execute the fork's code — Claude reads the diff via
    # the GitHub API only.

    runs-on: ubuntu-latest
    # Scoped to the minimum the reviewer needs: read the diff, write the review.
    # No `id-token: write` — we pass an explicit github_token below instead of
    # relying on the OIDC -> Claude GitHub App token exchange, which does not work
    # for the pull_request_target / fork-PR context.
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Check PR size
        id: check-size
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EVENT_ACTION=$(jq -r '.action' "$GITHUB_EVENT_PATH")
          
          if [ "$EVENT_ACTION" = "synchronize" ]; then
            BEFORE=$(jq -r '.before' "$GITHUB_EVENT_PATH")
            AFTER=$(jq -r '.after' "$GITHUB_EVENT_PATH")
            echo "Checking diff size between $BEFORE and $AFTER"
            
            # Use GitHub API to get the compare data
            COMPARE_URL="https://api.github.com/repos/${{ github.repository }}/compare/$BEFORE...$AFTER"
            TOTAL=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$COMPARE_URL" | jq '[.files[]?.additions, .files[]?.deletions] | add // 0')
            echo "This push contains $TOTAL changed lines."
          else
            ADDITIONS=$(jq -r '.pull_request.additions // 0' "$GITHUB_EVENT_PATH")
            DELETIONS=$(jq -r '.pull_request.deletions // 0' "$GITHUB_EVENT_PATH")
            TOTAL=$((ADDITIONS + DELETIONS))
            echo "PR has $TOTAL changed lines ($ADDITIONS additions, $DELETIONS deletions)."
          fi

          if [ "$TOTAL" -lt 30 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Changes ($TOTAL lines) are less than the 30 line threshold. Skipping Claude Code Review." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout base repository
        if: steps.check-size.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          # Checkout the base branch only — never the fork's head ref.
          # The review action reads the PR diff via GitHub API, not from disk.
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.check-size.outputs.skip != 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the ephemeral, repo-scoped workflow token instead of the OIDC App
          # exchange. On pull_request_target this is always the BASE repo's token
          # with the permissions declared above, so it works uniformly for every
          # PR — including those from contributor forks. Comments post as
          # github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Allow fork PRs from contributors WITHOUT repo write access to trigger
          # reviews. Accepted posture for a small project:
          #   - Claude CANNOT edit files or push: token is scoped contents:read +
          #     pull-requests:write, and claude_args grants no Edit/Write tools and
          #     no open-ended Bash/network — only read-only gh/git + posting comments.
          #   - Secret exfiltration is mitigated by the action's DEFAULT subprocess
          #     env scrubbing, which redacts GITHUB_TOKEN / Anthropic secrets, so an
          #     injected `gh pr comment --body "$TOKEN"` posts a redacted value.
          #     Do NOT set CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=0 — that disables this.
          #   - Residual ACCEPTED risk: compute/credit abuse, since anyone can now
          #     trigger paid runs. Narrow to a comma-separated username list if that
          #     stops being acceptable.
          allowed_non_write_users: '*'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Lock the session to ONLY what the code-review plugin needs (derived
          # from its command frontmatter + steps): launch review sub-agents, read
          # code, inspect git history, and comment via gh. Deliberately excludes
          # open-ended Bash, Edit/Write, and WebFetch/WebSearch — so a prompt
          # injection in an untrusted fork PR has no shell or network to exfiltrate
          # the ephemeral GITHUB_TOKEN through.
          #
          # NOTE: `mcp__github_inline_comment__create_inline_comment` is REQUIRED —
          # the code-review plugin posts each finding as an inline review comment via
          # this MCP tool (the action spins up the `github_inline_comment` server).
          # Without it, the review runs but every post is silently denied and the
          # action logs "No buffered inline comments" with a clean exit. `gh pr
          # comment` only covers the "no issues found" summary, not the findings.
          claude_args: >-
            --allowedTools
            "Task,Read,Grep,Glob,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
