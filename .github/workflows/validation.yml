# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate

on:
  pull_request:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      verify_postgres_firewall:
        description: "One-time proof that an external runner is rejected before PostgreSQL authentication"
        required: false
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  verify-postgres-firewall:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_postgres_firewall == true
    runs-on: ubuntu-24.04
    steps:
      - name: Verify rejection before authentication
        run: |
          set -euo pipefail
          runner_ip=$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)
          echo "External runner address: ${runner_ip}"

          sudo apt-get update
          sudo apt-get install --yes postgresql-client

          set +e
          output=$(PGCONNECT_TIMEOUT=10 \
            PGPASSWORD=deliberately-invalid-firewall-probe \
            psql \
              "host=tomoribot-postgres.postgres.database.azure.com port=5432 dbname=tomoribot user=firewall_probe sslmode=verify-full" \
              --command 'SELECT 1' 2>&1)
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Firewall probe unexpectedly connected." >&2
            exit 1
          fi

          if grep -Eqi 'password authentication failed|role .* does not exist' <<<"$output"; then
            echo "External runner reached PostgreSQL authentication; firewall rejection was not proven." >&2
            exit 1
          fi

          if grep -Eqi 'no pg_hba\.conf entry|not allowed|timeout expired|connection timed out|server closed the connection unexpectedly' <<<"$output"; then
            echo "External runner was rejected before PostgreSQL password authentication."
            exit 0
          fi

          echo "Firewall probe failed with an unrecognized pre-authentication response." >&2
          exit 1

  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tomodb_test
          POSTGRES_USER: tomori
          POSTGRES_PASSWORD: tomori_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tomori -d tomodb_test" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: tomori
      POSTGRES_PASSWORD: tomori_ci_password
      POSTGRES_DB: tomodb_test
      CRYPTO_SECRET: ci_validation_crypto_secret
      RUN_ENV: development

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify runtime dependency imports
        run: bun run check-runtime-imports

      - name: Run linting and type checks
        run: bun run lint && bun run check

      - name: Audit dependencies (bot only)
        # --filter . scopes to the root bot package; excludes workspace packages
        # such as apps/docs Astro build deps which have no runtime attack surface.
        run: bun audit --audit-level=high --filter .

      - name: Audit inline SQL outside repositories
        run: bun run scripts/checks/audit_sql.ts
        # Fails the check if any non-exempt SQL appears outside src/utils/db/repositories/.
        # See plans/refactor/phases/regression-checks/phase-6-regressions.md for the
        # tx`` regex fix that made this audit complete.

      - name: Check schema drift
        run: bun run check-schema

      - name: Check localization keys
        if: github.event_name != 'pull_request'
        run: |
          output=$(bun run check-locales 2>&1)
          exitCode=$?
          echo "$output"
          if echo "$output" | grep -q "MISSING LOCALIZATION KEYS"; then
            echo "Critical error: Missing localization keys found!"
            exit 1
          elif [ $exitCode -ne 0 ]; then
            echo "Localization warnings found, but no critical missing keys. Continuing..."
          fi

      - name: Run lifecycle validation
        run: bun run db:lifecycle

      - name: Run unit/integration tests
        run: bun run test
        # runTests.ts detects POSTGRES_PASSWORD, provisions a disposable
        # tomoribot_test_<id> database, injects TEST_DB_READY=1, and drops
        # the database after the suite completes (or on failure).
