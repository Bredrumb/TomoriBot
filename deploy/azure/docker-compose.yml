name: tomoribot-azure

services:
  tomoribot:
    image: ${TOMORIBOT_IMAGE:?TOMORIBOT_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUN_ENV: production
      PORT: "8081"
      SECRET_FILE: /run/secrets/tomoribot.json
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-vertex-wif.json
      CONTAINER_MEMORY_LIMIT_MB: "1536"
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
      # Mirror production JSON logs (level >= 50) to an append-only JSONL file
      # tailed by Azure Monitor Agent on the host (see bind mount below).
      TOMORI_LOG_FILE: /app/logs/tomoribot.jsonl
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /etc/tomoribot/secrets.json:/run/secrets/tomoribot.json:ro
      - /etc/tomoribot/google-vertex-wif.json:/run/secrets/google-vertex-wif.json:ro
      # Host directory is created by the deploy workflow with UID/GID 1001 (container
      # user "tomori") before compose starts; masks the image's /app/logs at runtime.
      - /var/log/tomoribot:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    profiles:
      - searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: http://localhost:8080/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
